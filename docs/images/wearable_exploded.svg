<text x="600" y="222" class="t">XIAO nRF52840 Sense</text>
<text x="600" y="241" class="d">21 × 17.5 mm, about 3 g</text>
<text x="600" y="258" class="d">Motion sensor, microphone, Bluetooth,</text>
<text x="600" y="275" class="d">charger and USB-C on one board</text>
